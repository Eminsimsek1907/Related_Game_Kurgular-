<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Pong Game</title>
    <style>
        /* Sayfanın geri kalanının temiz görünmesi için temel sıfırlama */
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
    </style>
</head>
<body>

<script>
(function () {
  if (window.__orangeBluePongFinal) return;
  window.__orangeBluePongFinal = true;

  const GAME_DURATION = 30000;
  const DISCOUNT_CODE = "GAME20";

  let gameStartTime = null;
  let running = false;
  let gameEnded = false;
  let firstStart = true;
  let animationId = null;

  const keys = {};
  const originalBodyOverflow = document.body.style.overflow;

  const isMobile = () =>
    /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  const gameBtn = document.createElement("div");
  gameBtn.innerHTML = `
    <div style="font-size:32px;">🎮</div>
    <div style="font-size:11px;font-weight:800;margin-top:2px;">PLAY</div>
  `;

  Object.assign(gameBtn.style, {
    position: "fixed",
    right: "22px",
    bottom: "22px",
    width: "72px",
    height: "72px",
    borderRadius: "50%",
    background: "linear-gradient(135deg,#ff9f1c,#2ec4ff)",
    color: "#fff",
    display: "flex",
    flexDirection: "column",
    alignItems: "center",
    justifyContent: "center",
    cursor: "pointer",
    zIndex: 99999,
    animation: "gamePulse 1.2s infinite",
    boxShadow: "0 12px 35px rgba(46,196,255,.45)",
    border: "2px solid rgba(255,255,255,.75)"
  });

  document.body.appendChild(gameBtn);

  const overlay = document.createElement("div");

  Object.assign(overlay.style, {
    position: "fixed",
    inset: 0,
    display: "none",
    alignItems: "center",
    justifyContent: "center",
    background:
      "radial-gradient(circle at top, rgba(46,196,255,.28), transparent 36%), radial-gradient(circle at bottom, rgba(255,159,28,.25), transparent 38%), linear-gradient(180deg,#071521,#02070d)",
    zIndex: 99998,
    padding: "14px",
    boxSizing: "border-box",
    overflow: "hidden",
    fontFamily: "Arial, sans-serif"
  });

  document.body.appendChild(overlay);

  const style = document.createElement("style");
  style.innerHTML = `
    @keyframes gamePulse {
      0% { transform: scale(1); }
      30% { transform: scale(1.12); }
      55% { transform: scale(1); }
      78% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes gameBlink {
      0% { opacity: .35; }
      50% { opacity: 1; }
      100% { opacity: .35; }
    }

    @keyframes gameShine {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }

    @media only screen and (max-width: 768px) {
      #gamePongContainer {
        padding: 10px !important;
        border-radius: 18px !important;
      }

      #gameStartText {
        top: 18px !important;
        font-size: 14px !important;
      }

      #gameCloseBtn {
        top: 8px !important;
        right: 8px !important;
        padding: 7px 12px !important;
        font-size: 11px !important;
      }
    }
  `;
  document.head.appendChild(style);

  const container = document.createElement("div");
  container.id = "gamePongContainer";

  Object.assign(container.style, {
    position: "relative",
    width: "100%",
    maxWidth: "940px",
    padding: "18px",
    borderRadius: "28px",
    background:
      "linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04))",
    border: "1px solid rgba(46,196,255,.42)",
    boxShadow: "0 30px 90px rgba(46,196,255,.25)",
    backdropFilter: "blur(12px)",
    boxSizing: "border-box",
    overflow: "hidden"
  });

  const shine = document.createElement("div");
  Object.assign(shine.style, {
    position: "absolute",
    inset: 0,
    background:
      "linear-gradient(120deg, transparent 20%, rgba(255,255,255,.14), transparent 80%)",
    animation: "gameShine 3.2s infinite",
    pointerEvents: "none"
  });

  const canvas = document.createElement("canvas");
  canvas.width = 900;
  canvas.height = 450;
  canvas.tabIndex = 1;

  Object.assign(canvas.style, {
    width: "100%",
    height: "auto",
    display: "block",
    borderRadius: "20px",
    background:
      "radial-gradient(circle at center, rgba(46,196,255,.18), transparent 60%), linear-gradient(135deg,#0b273b,#050b12)",
    boxShadow:
      "inset 0 0 0 3px rgba(255,159,28,.38), 0 0 50px rgba(46,196,255,.18)",
    touchAction: "none"
  });

  const ctx = canvas.getContext("2d");

  const topInfo = document.createElement("div");
  Object.assign(topInfo.style, {
    position: "absolute",
    left: "26px",
    top: "24px",
    zIndex: 3,
    color: "#2ec4ff",
    fontSize: "14px",
    fontWeight: "900",
    letterSpacing: ".5px",
    textShadow: "0 0 12px rgba(46,196,255,.65)"
  });
  topInfo.innerHTML = `ARCADE PONG`;

  const timerInfo = document.createElement("div");
  Object.assign(timerInfo.style, {
    position: "absolute",
    right: "88px",
    top: "24px",
    zIndex: 3,
    color: "#fff",
    fontSize: "14px",
    fontWeight: "900",
    background: "rgba(2,7,13,.58)",
    border: "1px solid rgba(255,159,28,.42)",
    borderRadius: "999px",
    padding: "6px 12px"
  });
  timerInfo.innerHTML = `⏳ <span id="gameTime">30</span>s`;

  const startText = document.createElement("div");
  startText.id = "gameStartText";

  startText.innerHTML = `
    <div style="font-size:28px;margin-bottom:8px;">🎯</div>
    <div>OYUNA BAŞLAMAK İÇİN DOKUN</div>
    <div style="font-size:13px;margin-top:7px;letter-spacing:0;color:#b7ecff;">
      Mobilde raketi parmağınla yukarı-aşağı sürükle
    </div>
  `;

  Object.assign(startText.style, {
    position: "absolute",
    top: "58px",
    left: "50%",
    transform: "translateX(-50%)",
    color: "#ffb24a",
    fontSize: "19px",
    fontWeight: "900",
    letterSpacing: "2px",
    animation: "gameBlink 1.3s infinite",
    textAlign: "center",
    width: "90%",
    zIndex: 4,
    pointerEvents: "none",
    textShadow: "0 0 16px rgba(255,159,28,.8)"
  });

  const resultBox = document.createElement("div");

  Object.assign(resultBox.style, {
    position: "absolute",
    inset: 0,
    zIndex: 8,
    display: "none",
    flexDirection: "column",
    alignItems: "center",
    justifyContent: "center",
    textAlign: "center",
    background:
      "radial-gradient(circle at center, rgba(46,196,255,.22), transparent 50%), rgba(2,7,13,.86)",
    color: "#2ec4ff",
    borderRadius: "28px",
    padding: "20px",
    boxSizing: "border-box"
  });

  const resultTitle = document.createElement("div");
  Object.assign(resultTitle.style, {
    fontSize: "38px",
    fontWeight: "900",
    marginBottom: "12px"
  });

  const resultSub = document.createElement("div");
  Object.assign(resultSub.style, {
    fontSize: "22px",
    color: "#fff",
    marginBottom: "20px"
  });

  const actionBtn = document.createElement("button");

  Object.assign(actionBtn.style, {
    padding: "13px 34px",
    borderRadius: "999px",
    border: "none",
    cursor: "pointer",
    background: "linear-gradient(135deg,#ff9f1c,#2ec4ff)",
    color: "#fff",
    fontSize: "16px",
    fontWeight: "900",
    boxShadow: "0 12px 34px rgba(46,196,255,.35)"
  });

  resultBox.append(resultTitle, resultSub, actionBtn);

  const closeBtn = document.createElement("button");
  closeBtn.id = "gameCloseBtn";
  closeBtn.textContent = "KAPAT";

  Object.assign(closeBtn.style, {
    position: "absolute",
    right: "18px",
    top: "18px",
    zIndex: 10,
    padding: "8px 15px",
    borderRadius: "999px",
    border: "1px solid rgba(46,196,255,.45)",
    background: "rgba(2,7,13,.75)",
    color: "#b7ecff",
    cursor: "pointer",
    fontWeight: "900"
  });

  container.append(
    shine,
    topInfo,
    timerInfo,
    closeBtn,
    startText,
    resultBox,
    canvas
  );

  overlay.append(container);

  const paddleH = 90;
  const paddleW = 12;

  const player = { x: 24, y: 180 };
  const ai = { x: 864, y: 180 };
  const ball = { x: 450, y: 225, vx: 4.4, vy: 3.2, s: 18 };

  function showRotateScreen() {
    overlay.innerHTML = `
      <div style="
        width:100%;
        height:100%;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        color:white;
        text-align:center;
        padding:24px;
        box-sizing:border-box;
      ">
        <div style="font-size:70px;margin-bottom:18px;">📱🔄</div>
        <h2 style="color:#ffb24a;margin:0 0 10px;">Lütfen cihazını yatay çevir</h2>
        <p style="max-width:320px;line-height:1.5;color:#b7ecff;">
          Bu oyun mobilde yatay ekranda oynanacak şekilde tasarlandı.
        </p>
      </div>
    `;

    tryLockLandscape();
  }

  function tryLockLandscape() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(function () {});
    }
  }

  function renderGameScreen() {
    overlay.innerHTML = "";
    overlay.append(container);
  }

  function checkOrientationBeforeStart() {
    if (isMobile() && window.innerHeight > window.innerWidth) {
      showRotateScreen();
      return false;
    }

    renderGameScreen();
    return true;
  }

  window.addEventListener("orientationchange", function () {
    setTimeout(function () {
      if (overlay.style.display !== "flex") return;

      if (isMobile() && window.innerHeight > window.innerWidth) {
        showRotateScreen();
        running = false;
      } else {
        renderGameScreen();
        resetGame();
        canvas.focus();

        if (!animationId) {
          loop();
        }
      }
    }, 350);
  });

  window.addEventListener("resize", function () {
    if (overlay.style.display !== "flex") return;

    if (isMobile() && window.innerHeight > window.innerWidth) {
      showRotateScreen();
      running = false;
    } else {
      renderGameScreen();
    }
  });

  function startPlaying() {
    if (!firstStart || gameEnded) return;

    firstStart = false;
    startText.style.display = "none";
    running = true;
    gameStartTime = performance.now();
  }

  function getCanvasPoint(e) {
    const rect = canvas.getBoundingClientRect();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    return {
      y: ((clientY - rect.top) / rect.height) * canvas.height
    };
  }

  function movePlayerByTouch(e) {
    e.preventDefault();
    startPlaying();

    const point = getCanvasPoint(e);
    player.y = point.y - paddleH / 2;
    player.y = Math.max(0, Math.min(canvas.height - paddleH, player.y));
  }

  canvas.addEventListener("touchstart", movePlayerByTouch, { passive: false });
  canvas.addEventListener("touchmove", movePlayerByTouch, { passive: false });

  canvas.addEventListener("mousedown", movePlayerByTouch);

  canvas.addEventListener("mousemove", function (e) {
    if (e.buttons === 1) movePlayerByTouch(e);
  });

  document.addEventListener(
    "keydown",
    function (e) {
      if (["ArrowUp", "ArrowDown", "w", "s"].includes(e.key)) {
        e.preventDefault();
      }

      keys[e.key] = true;
      startPlaying();
    },
    { passive: false }
  );

  document.addEventListener("keyup", function (e) {
    keys[e.key] = false;
  });

  gameBtn.onclick = function () {
    gameBtn.style.animation = "none";
    gameBtn.style.transform = "scale(1.35)";

    setTimeout(function () {
      gameBtn.style.display = "none";
    }, 100);

    document.body.style.overflow = "hidden";
    overlay.style.display = "flex";

    if (!checkOrientationBeforeStart()) return;

    resetGame();
    canvas.focus();

    if (!animationId) {
      loop();
    }
  };

  closeBtn.onclick = closeGame;

  function closeGame() {
    overlay.style.display = "none";
    gameBtn.style.display = "flex";
    gameBtn.style.transform = "scale(1)";
    gameBtn.style.animation = "gamePulse 1.2s infinite";
    document.body.style.overflow = originalBodyOverflow;

    running = false;
    gameEnded = false;
    firstStart = true;
    resultBox.style.display = "none";
    startText.style.display = "block";
  }

  function resetGame() {
    running = false;
    gameEnded = false;
    firstStart = true;

    resultBox.style.display = "none";
    startText.style.display = "block";

    player.y = 180;
    ai.y = 180;

    ball.x = 450;
    ball.y = 225;
    ball.vx = 4.4 * (Math.random() > 0.5 ? 1 : -1);
    ball.vy = 3.2;

    const timeEl = document.getElementById("gameTime");
    if (timeEl) timeEl.textContent = "30";
  }

  function endGame(win) {
    if (gameEnded) return;

    running = false;
    gameEnded = true;
    resultBox.style.display = "flex";

    if (win) {
      resultTitle.textContent = "🎉 SEN KAZANDIN!";
      resultSub.innerHTML = `
        İndirim Kodun:<br/>
        <span style="
          display:inline-block;
          margin-top:12px;
          padding:10px 22px;
          background:#fff;
          color:#0b273b;
          border-radius:999px;
          font-weight:900;
          letter-spacing:1px;
        ">
          ${DISCOUNT_CODE}
        </span>
      `;
      actionBtn.textContent = "KOPYALA";

      actionBtn.onclick = function () {
        navigator.clipboard.writeText(DISCOUNT_CODE);
        actionBtn.textContent = "KOPYALANDI";
      };
    } else {
      resultTitle.textContent = "OYUN BİTTİ";
      resultSub.textContent = "Bu sefer olmadı, tekrar dene.";
      actionBtn.textContent = "TEKRAR DENE";

      actionBtn.onclick = resetGame;
    }
  }

  function update() {
    if (!running || gameEnded) return;

    const elapsed = performance.now() - gameStartTime;
    const remaining = Math.max(0, Math.ceil((GAME_DURATION - elapsed) / 1000));

    const timeEl = document.getElementById("gameTime");
    if (timeEl) timeEl.textContent = remaining;

    if (elapsed >= GAME_DURATION) {
      endGame(false);
      return;
    }

    if (keys.w || keys.ArrowUp) player.y -= 7;
    if (keys.s || keys.ArrowDown) player.y += 7;

    player.y = Math.max(0, Math.min(canvas.height - paddleH, player.y));

    ai.y += (ball.y - (ai.y + paddleH / 2)) * 0.062;
    ai.y = Math.max(0, Math.min(canvas.height - paddleH, ai.y));

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y <= 0 || ball.y >= canvas.height - ball.s) {
      ball.vy *= -1;
    }

    if (
      ball.x <= player.x + paddleW &&
      ball.y + ball.s > player.y &&
      ball.y < player.y + paddleH
    ) {
      ball.vx = Math.abs(ball.vx) + 0.18;
      ball.vy += (ball.y - (player.y + paddleH / 2)) * 0.025;
    }

    if (
      ball.x + ball.s >= ai.x &&
      ball.y + ball.s > ai.y &&
      ball.y < ai.y + paddleH
    ) {
      ball.vx = -Math.abs(ball.vx) - 0.12;
      ball.vy += (ball.y - (ai.y + paddleH / 2)) * 0.018;
    }

    ball.vx = Math.max(-8, Math.min(8, ball.vx));
    ball.vy = Math.max(-7, Math.min(7, ball.vy));

    if (ball.x > canvas.width) endGame(true);
    if (ball.x < 0) endGame(false);
  }

  function drawBackgroundDetails() {
    ctx.save();

    ctx.fillStyle = "rgba(46,196,255,.13)";
    ctx.font = "900 42px Arial";
    ctx.textAlign = "center";
    ctx.fillText("ARCADE GAME", canvas.width / 2, canvas.height - 42);

    ctx.fillStyle = "rgba(255,255,255,.08)";
    for (let i = 0; i < 24; i++) {
      const x = (i * 91) % canvas.width;
      const y = (i * 67) % canvas.height;

      ctx.beginPath();
      ctx.arc(x, y, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawNet() {
    ctx.strokeStyle = "rgba(255,159,28,.55)";
    ctx.setLineDash([8, 13]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawPaddle(x, y) {
    ctx.save();

    ctx.fillStyle = "#ff9f1c";
    ctx.shadowColor = "#ff9f1c";
    ctx.shadowBlur = 16;

    ctx.beginPath();
    ctx.roundRect(x, y, paddleW, paddleH, 8);
    ctx.fill();

    ctx.restore();
  }

  function drawBall() {
    ctx.save();

    ctx.beginPath();
    ctx.arc(
      ball.x + ball.s / 2,
      ball.y + ball.s / 2,
      ball.s / 2,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#2ec4ff";
    ctx.shadowColor = "#2ec4ff";
    ctx.shadowBlur = 18;
    ctx.fill();

    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBackgroundDetails();
    drawNet();

    drawPaddle(player.x, player.y);
    drawPaddle(ai.x, ai.y);

    drawBall();
  }

  function loop() {
    update();
    draw();
    animationId = requestAnimationFrame(loop);
  }
})();
</script>

</body>
</html>
