<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Blur Finder</title>
</head>

<body>
    <script>
        (function () {
            "use strict";
            if (window.BlurFinderPopup) return;

            var URUNLER = [
                { img: "https://akn-gsstore.a-cdn.akinoncloud.com/cms/2026/01/13/2380274c-46f9-4fd3-a83b-ee6820aa2a80_size600x800.png", dogru: "Uğurcan Çakır", siklar: ["Uğurcan Çakır", "Icardi", "Kerem Aktürkoğlu", "Davinson Sánchez"] },
                { img: "https://akn-gsstore.a-cdn.akinoncloud.com/cms/2026/01/13/1f2ba66a-9ad1-4f6b-aee6-ef500479dfc3_size600x800.png", dogru: "Icardi", siklar: ["Icardi", "Osimhen", "Barış Alper Yılmaz", "Yunus Akgün"] },
                { img: "https://akn-gsstore.a-cdn.akinoncloud.com/cms/2026/01/13/c1aebed1-9ebb-4593-8d9f-0d62829fa3cf_size600x800.png", dogru: "Osimhen", siklar: ["Osimhen", "Uğurcan Çakır", "Lucas Torreira", "Hakim Ziyech"] }
            ];

            var INDIRIM_KODU = "GSSTORE20";

            var currentSoru = 0;
            var dogruSayisi = 0;
            var yanlisHak = 3;
            var blurPx = 24;
            var popupEl = null;
            var gameEl = null;
            var resultEl = null;

            function shuffle(arr) {
                var a = arr.slice();
                for (var i = a.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var t = a[i]; a[i] = a[j]; a[j] = t;
                }
                return a;
            }

            function getBody() {
                return document.body || document.getElementsByTagName("body")[0] || null;
            }

            function injectStyles() {
                if (document.getElementById("blur-finder-styles")) return;
                var s = document.createElement("style");
                s.id = "blur-finder-styles";
                s.innerHTML = `
            #blur-finder-popup {
                position: fixed;
                inset: 0;
                z-index: 999999;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(0,0,0,0.6);
                padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
                box-sizing: border-box;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            #blur-finder-popup .bf-box {
                position: relative;
                z-index: 1;
                display: flex;
                flex-wrap: wrap;
                gap: clamp(16px, 3vw, 24px);
                max-width: min(720px, 100%);
                width: 100%;
                max-height: min(92dvh, 92vh);
                margin: auto;
                background: #1a1a1a;
                border: 3px solid #FDB813;
                box-shadow: 0 0 0 2px #c8102e;
                border-radius: 12px;
                overflow-x: hidden;
                overflow-y: auto;
                padding: clamp(18px, 4vw, 28px);
                box-sizing: border-box;
            }
            #blur-finder-popup .bf-game {
                display: flex;
                flex: 1;
                width: 100%;
                min-width: 0;
                flex-wrap: wrap;
                gap: clamp(16px, 3vw, 24px);
                align-items: flex-start;
            }
            #blur-finder-popup .bf-close {
                position: absolute;
                right: max(10px, env(safe-area-inset-right, 10px));
                top: max(10px, env(safe-area-inset-top, 10px));
                width: 36px;
                height: 36px;
                border: none;
                border-radius: 50%;
                background: transparent;
                color: #fff;
                font-size: 26px;
                line-height: 1;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 5;
                transition: background 0.3s ease, color 0.3s ease;
            }
            #blur-finder-popup .bf-close:hover {
                background: #c8102e;
            }
            #blur-finder-popup .bf-left {
                flex: 1 1 220px;
                min-width: 0;
                max-width: 100%;
                position: relative;
                padding-right: 40px;
            }
            #blur-finder-popup .bf-card {
                background: rgba(255,255,255,0.08);
                border-radius: 16px;
                overflow: hidden;
                border: 1px solid rgba(253,184,19,0.4);
                aspect-ratio: 3 / 4;
                max-height: min(56dvh, 56vh, 420px);
                width: 100%;
                margin-left: auto;
                margin-right: auto;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #blur-finder-popup .bf-card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center;
                display: block;
                transition: filter 0.45s ease;
            }
            #blur-finder-popup .bf-right {
                flex: 1 1 260px;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            #blur-finder-popup .bf-title {
                color: #FDB813;
                font-size: clamp(16px, 2.5vw, 18px);
                font-weight: bold;
                margin-bottom: 6px;
                line-height: 1.3;
            }
            #blur-finder-popup .bf-hak {
                color: #888;
                font-size: clamp(12px, 2vw, 13px);
                margin-bottom: 4px;
            }
            #blur-finder-popup .bf-btn {
                width: 100%;
                padding: max(14px, 0.75rem) 16px;
                border: 2px solid #FDB813;
                border-radius: 8px;
                background: #1a1a1a;
                color: #fff;
                font-size: clamp(14px, 2.2vw, 15px);
                text-align: left;
                cursor: pointer;
                transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            }
            #blur-finder-popup .bf-btn:hover:not(:disabled) {
                background: #FDB813;
                color: #1a1a1a;
            }
            #blur-finder-popup .bf-btn:disabled {
                cursor: default;
                opacity: 0.65;
            }
            #blur-finder-popup .bf-btn.correct {
                background: #00c853;
                border-color: #00c853;
                color: #fff;
            }
            #blur-finder-popup .bf-btn.wrong {
                background: #ff5252;
                border-color: #ff5252;
                color: #fff;
            }
            #blur-finder-popup .bf-result {
                display: none;
                text-align: center;
                padding: clamp(20px, 4vw, 32px) clamp(16px, 3vw, 24px);
                width: 100%;
                box-sizing: border-box;
            }
            #blur-finder-popup .bf-result-title {
                color: #FDB813;
                font-size: clamp(20px, 4vw, 24px);
                font-weight: bold;
                margin-bottom: 12px;
            }
            #blur-finder-popup .bf-result-text {
                color: #fff;
                font-size: clamp(14px, 2.5vw, 16px);
                margin-bottom: 16px;
                line-height: 1.45;
            }
            #blur-finder-popup .bf-result-win,
            #blur-finder-popup .bf-result-lose {
                width: 100%;
                max-width: 320px;
                margin-left: auto;
                margin-right: auto;
            }
            #blur-finder-popup .bf-result-win {
                display: none;
            }
            #blur-finder-popup .bf-result-lose {
                display: none;
            }
            #blur-finder-popup .bf-result-code {
                display: block;
                width: 100%;
                max-width: 280px;
                margin-left: auto;
                margin-right: auto;
                padding: 14px 20px;
                background: #FDB813;
                color: #1a1a1a;
                border: 2px dashed #c8102e;
                border-radius: 8px;
                font-size: clamp(16px, 3vw, 18px);
                font-weight: bold;
                text-align: center;
                margin-top: 0;
                margin-bottom: 12px;
                box-sizing: border-box;
                transition: border-color 0.3s ease;
                cursor: default;
            }
            #blur-finder-popup .bf-btn-copy {
                width: 100%;
                max-width: 280px;
                margin-left: auto;
                margin-right: auto;
                display: block;
                padding: 14px 20px;
                border: none;
                border-radius: 8px;
                background: #f39c12;
                color: #fff;
                font-size: clamp(15px, 2.5vw, 16px);
                font-weight: bold;
                cursor: pointer;
                transition: background 0.3s ease;
                box-sizing: border-box;
            }
            #blur-finder-popup .bf-btn-copy:hover {
                background: #e67e22;
            }
            #blur-finder-popup .bf-btn-copy.bf-copied {
                background: #27ae60;
            }
            #blur-finder-popup .bf-btn-again {
                width: 100%;
                max-width: 280px;
                margin-left: auto;
                margin-right: auto;
                display: block;
                padding: 14px 22px;
                border: 2px solid #7c3aed;
                border-radius: 999px;
                background: #7c3aed;
                color: #fff;
                font-size: clamp(15px, 2.5vw, 16px);
                font-weight: bold;
                cursor: pointer;
                margin-top: 12px;
                transition: background 0.3s ease, border-color 0.3s ease;
                box-sizing: border-box;
            }
            #blur-finder-popup .bf-btn-again:hover {
                background: #6d28d9;
                border-color: #6d28d9;
            }
            @media (max-width: 900px) {
                #blur-finder-popup .bf-box {
                    flex-direction: column;
                    max-height: min(96dvh, 96vh);
                }
                #blur-finder-popup .bf-game {
                    flex-direction: column;
                }
                #blur-finder-popup .bf-left {
                    flex-basis: auto;
                    width: 100%;
                    padding-right: 36px;
                }
                #blur-finder-popup .bf-right {
                    flex-basis: auto;
                    width: 100%;
                }
                #blur-finder-popup .bf-card {
                    max-width: min(340px, 100%);
                    max-height: min(50dvh, 50vh, 380px);
                }
            }
            @media (max-width: 600px) {
                #blur-finder-popup .bf-box {
                    padding: 20px 16px;
                    border-radius: 10px;
                }
                #blur-finder-popup .bf-left,
                #blur-finder-popup .bf-right { min-width: 100%; }
                #blur-finder-popup .bf-title { margin-top: 4px; }
            }
            @media (max-height: 520px) and (orientation: landscape) {
                #blur-finder-popup .bf-box {
                    max-height: min(98dvh, 98vh);
                    padding: 12px 14px;
                    gap: 12px;
                }
                #blur-finder-popup .bf-game {
                    flex-direction: row;
                    flex-wrap: nowrap;
                    align-items: stretch;
                }
                #blur-finder-popup .bf-left {
                    flex: 0 0 38%;
                    max-width: 38%;
                    padding-right: 32px;
                }
                #blur-finder-popup .bf-card {
                    max-height: min(72dvh, 72vh);
                    aspect-ratio: 3 / 4;
                    max-width: 100%;
                }
                #blur-finder-popup .bf-right {
                    flex: 1;
                    min-width: 0;
                    gap: 8px;
                }
                #blur-finder-popup .bf-btn {
                    padding: 10px 12px;
                    font-size: 13px;
                }
                #blur-finder-popup .bf-close {
                    width: 32px;
                    height: 32px;
                    font-size: 22px;
                }
            }
            @media (pointer: coarse) {
                #blur-finder-popup .bf-close {
                    min-width: 44px;
                    min-height: 44px;
                }
                #blur-finder-popup .bf-btn {
                    min-height: 44px;
                }
                #blur-finder-popup .bf-btn-copy,
                #blur-finder-popup .bf-btn-again {
                    min-height: 48px;
                }
            }
        `;
                (document.head || document.documentElement).appendChild(s);
            }

            function buildPopup() {
                var body = getBody();
                if (!body) return null;
                injectStyles();
                var box = document.createElement("div");
                box.id = "blur-finder-popup";
                box.style.display = "none";
                box.innerHTML =
                    '<div class="bf-box" style="position:relative;">' +
                    '<button type="button" class="bf-close" aria-label="Kapat">&times;</button>' +
                    '<div class="bf-game">' +
                    '<div class="bf-left">' +
                    '<div class="bf-title">Ürünü tahmin et</div>' +
                    '<div class="bf-card"><img id="bf-img" src="" alt="Ürün" /></div>' +
                    '</div>' +
                    '<div class="bf-right">' +
                    '<div class="bf-hak" id="bf-hak">Kalan hak: 3</div>' +
                    '<button type="button" class="bf-btn" data-sik="0"></button>' +
                    '<button type="button" class="bf-btn" data-sik="1"></button>' +
                    '<button type="button" class="bf-btn" data-sik="2"></button>' +
                    '<button type="button" class="bf-btn" data-sik="3"></button>' +
                    '</div>' +
                    '</div>' +
                    '<div class="bf-result">' +
                    '<div class="bf-result-title" id="bf-result-title"></div>' +
                    '<div class="bf-result-text" id="bf-result-text"></div>' +
                    '<div class="bf-result-win" id="bf-result-win">' +
                    '<div class="bf-result-code" id="bf-result-code"></div>' +
                    '<button type="button" class="bf-btn-copy" id="bf-btn-copy">Kodu Kopyala</button>' +
                    '</div>' +
                    '<div class="bf-result-lose" id="bf-result-lose">' +
                    '<button type="button" class="bf-btn-again" id="bf-btn-again">Tekrar Oyna</button>' +
                    '</div>' +
                    '</div>' +
                    '</div>';
                box.querySelector(".bf-close").onclick = function () { box.style.display = "none"; };
                box.querySelector(".bf-box").onclick = function (e) { e.stopPropagation(); };
                box.onclick = function (e) { if (e.target === box) box.style.display = "none"; };
                body.appendChild(box);
                return box;
            }

            function getEl(id) {
                return popupEl ? popupEl.querySelector("#" + id) : null;
            }

            function guncelleBlur(px) {
                var img = getEl("bf-img");
                if (!img) return;
                var n = typeof px === "number" ? px : parseFloat(px);
                if (!n || n <= 0) img.style.filter = "none";
                else img.style.filter = "blur(" + n + "px)";
            }

            function kopyalaKodu() {
                var k = INDIRIM_KODU;
                var btn = getEl("bf-btn-copy");
                var bitti = function () {
                    if (btn) {
                        btn.textContent = "Kopyalandı!";
                        btn.classList.add("bf-copied");
                    }
                };
                var yedek = function () {
                    var t = document.createElement("input");
                    t.value = k;
                    document.body.appendChild(t);
                    t.select();
                    try { document.execCommand("copy"); } catch (e) { }
                    document.body.removeChild(t);
                    bitti();
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(k).then(bitti).catch(yedek);
                } else yedek();
            }

            function tekrarOyna() {
                if (!popupEl || !gameEl || !resultEl) return;
                currentSoru = 0;
                dogruSayisi = 0;
                yanlisHak = 3;
                blurPx = 24;
                resultEl.style.display = "none";
                gameEl.style.display = "flex";
                var winWrap = popupEl.querySelector("#bf-result-win");
                var loseWrap = popupEl.querySelector("#bf-result-lose");
                if (winWrap) winWrap.style.display = "none";
                if (loseWrap) loseWrap.style.display = "none";
                var cb = getEl("bf-btn-copy");
                if (cb) {
                    cb.textContent = "Kodu Kopyala";
                    cb.classList.remove("bf-copied");
                }
                soruGoster();
            }

            function sonucGoster(kazandi) {
                if (!gameEl || !resultEl || !popupEl) return;
                gameEl.style.display = "none";
                resultEl.style.display = "block";
                var title = getEl("bf-result-title");
                var text = getEl("bf-result-text");
                var code = getEl("bf-result-code");
                var winWrap = popupEl.querySelector("#bf-result-win");
                var loseWrap = popupEl.querySelector("#bf-result-lose");
                var copyBtn = getEl("bf-btn-copy");
                if (kazandi) {
                    if (title) title.textContent = "Tebrikler!";
                    if (text) text.textContent = "%20 indirim kazandınız. Kodu sepette kullanabilirsiniz.";
                    if (winWrap) winWrap.style.display = "block";
                    if (loseWrap) loseWrap.style.display = "none";
                    if (code) {
                        code.style.display = "block";
                        code.textContent = INDIRIM_KODU;
                    }
                    if (copyBtn) {
                        copyBtn.textContent = "Kodu Kopyala";
                        copyBtn.classList.remove("bf-copied");
                    }
                } else {
                    if (title) title.textContent = "Bu sefer olmadı";
                    if (text) text.textContent = "3 soruyu da doğru bilmeniz gerekiyordu.";
                    if (winWrap) winWrap.style.display = "none";
                    if (loseWrap) loseWrap.style.display = "block";
                    if (code) code.textContent = "";
                }
            }

            function soruGoster() {
                var u = URUNLER[currentSoru];
                var img = getEl("bf-img");
                var hakEl = getEl("bf-hak");
                if (img) {
                    img.src = u.img;
                    guncelleBlur(blurPx);
                }
                if (hakEl) hakEl.textContent = "Kalan hak: " + yanlisHak;
                var btns = popupEl.querySelectorAll(".bf-btn");
                var siklar = shuffle(u.siklar);
                for (var i = 0; i < btns.length; i++) {
                    btns[i].textContent = siklar[i];
                    btns[i].disabled = false;
                    btns[i].className = "bf-btn";
                    btns[i].dataset.cevap = siklar[i];
                }
            }

            function tikla(cevap) {
                var u = URUNLER[currentSoru];
                var btns = popupEl.querySelectorAll(".bf-btn");
                for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
                if (cevap === u.dogru) {
                    var btn = popupEl.querySelector('[data-cevap="' + u.dogru + '"]');
                    if (btn) btn.classList.add("correct");
                    guncelleBlur(0);
                    dogruSayisi++;
                    if (dogruSayisi >= 3) {
                        setTimeout(function () { sonucGoster(true); }, 600);
                        return;
                    }
                    currentSoru++;
                    yanlisHak = 3;
                    blurPx = 24;
                    setTimeout(function () { soruGoster(); }, 800);
                } else {
                    var wrongBtn = popupEl.querySelector('[data-cevap="' + cevap + '"]');
                    if (wrongBtn) wrongBtn.classList.add("wrong");
                    yanlisHak--;
                    blurPx = Math.max(0, blurPx - 8);
                    guncelleBlur(blurPx);
                    var hakEl = getEl("bf-hak");
                    if (hakEl) hakEl.textContent = "Kalan hak: " + yanlisHak;
                    if (yanlisHak <= 0) {
                        setTimeout(function () { sonucGoster(false); }, 800);
                        return;
                    }
                    setTimeout(function () {
                        for (var j = 0; j < btns.length; j++) btns[j].disabled = false;
                        wrongBtn.classList.remove("wrong");
                    }, 500);
                }
            }

            function open() {
                if (!popupEl) popupEl = buildPopup();
                if (!popupEl) return;
                gameEl = popupEl.querySelector(".bf-game");
                resultEl = popupEl.querySelector(".bf-result");
                currentSoru = 0;
                dogruSayisi = 0;
                yanlisHak = 3;
                blurPx = 24;
                if (gameEl) gameEl.style.display = "flex";
                if (resultEl) resultEl.style.display = "none";
                soruGoster();
                var rightCol = popupEl.querySelector(".bf-right");
                if (rightCol) {
                    rightCol.onclick = function (e) {
                        var btn = e.target && e.target.classList && e.target.classList.contains("bf-btn") ? e.target : null;
                        if (btn && !btn.disabled) tikla(btn.dataset.cevap);
                    };
                }
                var copyBtn = popupEl.querySelector("#bf-btn-copy");
                if (copyBtn && !copyBtn.dataset.bfBound) {
                    copyBtn.dataset.bfBound = "1";
                    copyBtn.onclick = function (e) {
                        e.stopPropagation();
                        kopyalaKodu();
                    };
                }
                var againBtn = popupEl.querySelector("#bf-btn-again");
                if (againBtn && !againBtn.dataset.bfBound) {
                    againBtn.dataset.bfBound = "1";
                    againBtn.onclick = function (e) {
                        e.stopPropagation();
                        tekrarOyna();
                    };
                }
                popupEl.style.display = "flex";
            }

            window.BlurFinderPopup = { open: open };

            function run() {
                if (getBody()) open();
                else setTimeout(run, 80);
            }
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run);
            else run();
        })();
    </script>
</body>

</html>
